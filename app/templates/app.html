{% extends "base.html" %}
{% block body %}
<div x-data="dashboard" x-cloak>
  <header class="topbar">
    <div class="topbar-start">
      <h1 class="brand">{{ t('app.title') }}</h1>
      <label class="month-picker">
        <span class="sr-only">{{ t('nav.month') }}</span>
        <select @change="load(Number($event.target.value))" :disabled="busy">
          <template x-for="m in months" :key="m.id">
            <option :value="m.id" :selected="m.id === budgetId" x-text="m.label"></option>
          </template>
        </select>
      </label>
      <button class="btn btn-small btn-primary" type="button" @click="openWizard()" :disabled="busy || !months.length"
              x-text="months.length ? t('nav.new_month_label', {label: nextLabel()}) : t('nav.new_month')"></button>
    </div>
    <nav>
      <span class="muted">{{ username }}</span>
      {% include "_lang_switch.html" %}
      <a class="btn btn-small btn-ghost" href="/settings">{{ t('common.settings') }}</a>
      <button class="btn btn-small btn-ghost" type="button" data-logout>{{ t('common.logout') }}</button>
    </nav>
  </header>

  <main class="page" x-show="d">
    <template x-if="d">
      <div class="stack">

        {# the widgets, in rows: app/dashboard.py (DEFAULT_LAYOUT) #}
        {% for row in dashboard_layout %}
        {% if row|length > 1 %}
        <section class="grid-3">
          {% for widget in row %}{% include "widgets/" ~ widget ~ ".html" %}{% endfor %}
        </section>
        {% else %}
        {% include "widgets/" ~ row[0] ~ ".html" %}
        {% endif %}
        {% endfor %}
      </div>
    </template>
  </main>

  <p class="page muted" x-show="!d && !error">{{ t('common.loading') }}</p>
  <p class="page neg" x-show="error" x-text="error"></p>

  <!-- ================= new month wizard ================= -->
  <div class="modal-backdrop" x-show="wizard.open" x-transition.opacity @keydown.escape.window="closeWizard()">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wizard-title" @click.outside="closeWizard()">
      <div class="modal-head">
        <h2 id="wizard-title" x-text="wizard.plan ? t('wizard.title_with', {label: wizard.plan.target.label}) : t('wizard.title')"></h2>
        <button class="icon-btn" type="button" title="{{ t('common.close') }}" @click="closeWizard()">✕</button>
      </div>

      <template x-if="wizard.plan">
        <div class="modal-body">
          <section class="wiz-section">
            <h3>{{ t('wizard.month') }}</h3>
            <div class="inline-fields">
              <label class="field"><span>{{ t('wizard.month') }}</span>
                <select :value="wizard.month" @change="setWizardPeriod(wizard.year, Number($event.target.value))">
                  <template x-for="m in 12" :key="m">
                    <option :value="m" :selected="m === wizard.month" x-text="String(m).padStart(2, '0')"></option>
                  </template>
                </select>
              </label>
              <label class="field"><span>{{ t('wizard.year') }}</span>
                <input type="number" min="2000" max="2200" :value="wizard.year"
                       @change="setWizardPeriod(Number($event.target.value), wizard.month)">
              </label>
            </div>
          </section>

          <!-- an earlier month: created empty, nothing is carried -->
          <template x-if="wizard.plan.mode === 'blank'">
            <section class="wiz-section">
              <div class="alert alert-warn">
                <strong>{{ t('wizard.older_title') }}</strong> —
                <span x-text="t('wizard.older_hint', {latest: wizard.plan.latest ? wizard.plan.latest.label : ''})"></span>
              </div>
            </section>
          </template>

          <template x-if="wizard.plan.mode === 'copy'">
            <div>
              <p class="muted small" x-text="t('wizard.source', {label: wizard.plan.source.label})"></p>

              <section class="wiz-section">
                <h3>{{ t('wizard.balances') }}</h3>
                <div class="inline-fields">
                  <label class="field"><span>{{ t('wizard.emergency') }}</span>
                    <input class="num" type="number" step="0.01" min="0" x-model.number="wizard.balances.emergency_current"></label>
                  <label class="field"><span>{{ t('wizard.emergency_min') }}</span>
                    <input class="num" type="number" step="0.01" min="0" x-model.number="wizard.balances.emergency_min"></label>
                  <label class="field"><span>{{ t('wizard.savings') }}</span>
                    <input class="num" type="number" step="0.01" min="0" x-model.number="wizard.balances.savings_current"></label>
                </div>
                <label class="check" x-show="wizard.plan.return_to_savings > 0">
                  <input type="checkbox" :checked="wizard.addReturn" @change="toggleReturn($event.target.checked)">
                  <span x-text="t('wizard.return', {amount: money(wizard.plan.return_to_savings)})"></span>
                </label>
              </section>

              <section class="wiz-section" x-show="wizard.plan.unpaid.length">
                <h3>{{ t('wizard.unpaid_title') }}</h3>
                <p class="muted small">{{ t('wizard.unpaid_hint') }}</p>
                <ul class="check-list">
                  <template x-for="u in wizard.plan.unpaid" :key="u.id">
                    <li><label class="check">
                      <input type="checkbox" :checked="wizard.carry.includes(u.id)" @change="toggleCarry(u.id)">
                      <span x-text="u.name"></span><span class="muted" x-text="money(u.due)"></span>
                    </label></li>
                  </template>
                </ul>
              </section>

              <section class="wiz-section">
                <h3 x-text="t('wizard.expenses_title', {n: wizard.plan.expenses.length})"></h3>
                <p class="muted" x-show="!wizard.plan.expenses.length">{{ t('wizard.expenses_none') }}</p>
                <table class="kv" x-show="wizard.plan.expenses.length">
                  <template x-for="(e, i) in wizard.plan.expenses" :key="i">
                    <tr>
                      <th>
                        <span x-text="e.name"></span>
                        <span class="chip" :class="'origin-' + e.origin" x-text="t('wizard.origin_' + e.origin)"></span>
                        <small class="muted" x-show="e.origin === 'installment'"
                               x-text="t('wizard.installment_left', {count: e.inst_count, balance: money(e.inst_balance)})"></small>
                      </th>
                      <td>
                        <span x-show="e.needs_amount" class="warn-text">{{ t('wizard.needs_price') }}</span>
                        <span x-show="!e.needs_amount" x-text="money(planBase(e))"></span>
                        <small class="muted" x-show="e.carried_in > 0" x-text="t('wizard.plus_carried', {amount: money(e.carried_in)})"></small>
                      </td>
                    </tr>
                  </template>
                </table>
              </section>

              <section class="wiz-section" x-show="wizard.plan.incomes.length">
                <h3>{{ t('wizard.incomes_title') }}</h3>
                <table class="kv">
                  <template x-for="(inc, i) in wizard.plan.incomes" :key="i">
                    <tr><th x-text="inc.source"></th>
                      <td><span x-show="inc.needs_amount" class="warn-text">{{ t('wizard.needs_amount') }}</span>
                        <span x-show="!inc.needs_amount" x-text="money(inc.amount)"></span></td></tr>
                  </template>
                </table>
              </section>
              <p class="muted small" x-show="!wizard.plan.incomes.length">
                {{ t('wizard.incomes_none') }} <a href="/settings#templates">{{ t('wizard.incomes_settings_link') }}</a>.
              </p>

              <section class="wiz-section" x-show="wizard.plan.goals.length">
                <h3 x-text="t('wizard.goals_title', {n: wizard.plan.goals.length})"></h3>
                <label class="check" x-show="completedGoals().length">
                  <input type="checkbox" x-model="wizard.dropCompleted">
                  <span x-text="t('wizard.goals_drop', {names: completedGoals().join(t('common.list_sep'))})"></span>
                </label>
                <p class="muted small" x-show="!completedGoals().length">{{ t('wizard.goals_keep_all') }}</p>
              </section>
            </div>
          </template>
        </div>
      </template>

      <div class="modal-foot">
        <button class="btn btn-small btn-ghost" type="button" @click="closeWizard()">{{ t('common.cancel') }}</button>
        <button class="btn btn-small btn-primary" type="button" :disabled="busy || !wizard.plan" @click="confirmWizard()"
                x-text="wizard.plan ? t('wizard.create', {label: wizard.plan.target.label}) : t('common.loading')"></button>
      </div>
    </div>
  </div>

  <div class="toast" role="status" x-show="toast" x-transition x-text="toast"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script defer src="{{ url_for('static', filename='vendor/alpine-3.14.9.min.js') }}"></script>
{% endblock %}
