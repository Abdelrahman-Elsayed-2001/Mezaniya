{# rows of a savings / emergency widget's table: the month's money of `kind` held in other currencies #}
<template x-for="fb in foreignBalances('{{ kind }}')" :key="fb.id">
  <tr class="sub foreign-balance">
    <th x-text="currencyName(fb.currency)"></th>
    <td><input class="num" type="number" step="0.01" min="0" :value="fb.amount"
               @change="setForeignBalance('{{ kind }}', fb.currency, $event.target.value)"></td>
    <td><button class="icon-btn" type="button" title="{{ t('common.delete') }}"
                @click="setForeignBalance('{{ kind }}', fb.currency, 0)">✕</button></td>
  </tr>
</template>
<tr class="sub add-balance">
  <th><select x-model="newBalance.{{ kind }}.currency" title="{{ t('balances.add_hint') }}">
    <option value="">{{ t('balances.add') }}</option>
    <template x-for="c in otherCurrencies('{{ kind }}')" :key="c.code">
      <option :value="c.code" x-text="c.name + ' (' + c.symbol + ')'"></option>
    </template>
  </select></th>
  <td><input class="num" type="number" step="0.01" min="0" placeholder="0" x-show="newBalance.{{ kind }}.currency"
             x-model="newBalance.{{ kind }}.amount" @keydown.enter="addForeignBalance('{{ kind }}')"></td>
  <td><button class="icon-btn add" type="button" title="{{ t('common.add') }}" x-show="newBalance.{{ kind }}.currency"
              @click="addForeignBalance('{{ kind }}')">+</button></td>
</tr>
